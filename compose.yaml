services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nailconnect
      POSTGRES_USER: nailconnect
      POSTGRES_PASSWORD: nailconnect
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nailconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
